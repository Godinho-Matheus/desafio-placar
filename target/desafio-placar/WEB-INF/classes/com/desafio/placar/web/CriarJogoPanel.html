<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
    <wicket:panel>
        <!-- Criacao de Jogo: submit sincrono simples (sem Ajax). -->
        <form wicket:id="criarJogoForm" class="criar-jogo">
            <fieldset>
                <legend>Criar jogo</legend>
                <div>
                    <label for="timeA">Time A:</label>
                    <input type="text" wicket:id="timeA" id="timeA"/>
                </div>
                <div>
                    <label for="timeB">Time B:</label>
                    <input type="text" wicket:id="timeB" id="timeB"/>
                </div>
                <div>
                    <label for="dataHoraPartida">Data/Hora (ISO-8601 com offset):</label>
                    <input type="text" wicket:id="dataHoraPartida" id="dataHoraPartida"
                           placeholder="2025-01-01T20:00:00-03:00"/>
                </div>
                <button type="submit">Criar</button>
            </fieldset>
        </form>
    </wicket:panel>
</body>
</html>
