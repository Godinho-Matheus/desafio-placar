<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
    <wicket:panel>
        <!-- Atualizacao de placar: submit sincrono simples (sem Ajax). -->
        <form wicket:id="atualizarPlacarForm" class="placar-acoes acao-atualizar">
            <input type="number" wicket:id="placarA" min="0" size="3"/>
            <span>x</span>
            <input type="number" wicket:id="placarB" min="0" size="3"/>
            <button wicket:id="atualizarBotao" type="submit">Atualizar placar</button>
        </form>
        <!-- Encerramento: submit sincrono simples (sem Ajax). -->
        <form wicket:id="encerrarForm" class="placar-acoes acao-encerrar">
            <button wicket:id="encerrarBotao" type="submit">Encerrar</button>
        </form>
    </wicket:panel>
</body>
</html>
