<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
    <wicket:panel>
        <!-- Criacao de Jogo: submit sincrono simples (sem Ajax). -->
        <form wicket:id="criarJogoForm" class="criar-jogo">
            <fieldset>
                <legend>Criar jogo</legend>
                <div class="campos">
                    <div class="campo">
                        <label for="timeA">Time A</label>
                        <input type="text" wicket:id="timeA" id="timeA"/>
                    </div>
                    <div class="campo">
                        <label for="timeB">Time B</label>
                        <input type="text" wicket:id="timeB" id="timeB"/>
                    </div>
                    <div class="campo">
                        <label for="dataHoraPartida">Data e hora da partida</label>
                        <input type="datetime-local" wicket:id="dataHoraPartida" id="dataHoraPartida"/>
                    </div>
                    <div class="campo">
                        <label for="offset">Fuso horario</label>
                        <select wicket:id="offset" id="offset"></select>
                        <span class="dica">Padrao: UTC-03:00 (horario de Brasilia)</span>
                    </div>
                </div>
                <button type="submit" class="botao-primario">Criar jogo</button>
            </fieldset>
        </form>
    </wicket:panel>
</body>
</html>
