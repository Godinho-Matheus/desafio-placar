<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
    <wicket:panel>
        <!-- Criacao de Jogo: submit sincrono simples (sem Ajax). Textos i18n. -->
        <form wicket:id="criarJogoForm" class="criar-jogo">
            <fieldset>
                <legend><wicket:message key="criarJogo.legenda">Criar jogo</wicket:message></legend>
                <div class="campos">
                    <div class="campo">
                        <label for="timeA"><wicket:message key="criarJogo.timeA">Time A</wicket:message></label>
                        <input type="text" wicket:id="timeA" id="timeA"/>
                    </div>
                    <div class="campo">
                        <label for="timeB"><wicket:message key="criarJogo.timeB">Time B</wicket:message></label>
                        <input type="text" wicket:id="timeB" id="timeB"/>
                    </div>
                    <div class="campo">
                        <label for="dataHoraPartida"><wicket:message key="criarJogo.dataHora">Data e hora da partida</wicket:message></label>
                        <input type="datetime-local" wicket:id="dataHoraPartida" id="dataHoraPartida"/>
                    </div>
                    <div class="campo">
                        <label for="offset"><wicket:message key="criarJogo.fuso">Fuso horario</wicket:message></label>
                        <select wicket:id="offset" id="offset"></select>
                        <span class="dica"><wicket:message key="criarJogo.fusoDica">Padrao: UTC-03:00 (horario de Brasilia)</wicket:message></span>
                    </div>
                </div>
                <button type="submit" class="botao-primario"><wicket:message key="criarJogo.botao">Criar jogo</wicket:message></button>
            </fieldset>
        </form>
    </wicket:panel>
</body>
</html>
