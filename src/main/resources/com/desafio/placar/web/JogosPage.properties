# ==========================================================================
# Textos da pagina de listagem (JogosPage) - IDIOMA PADRAO: Portugues.
#
# Bundle de COMPONENTE: fica ao lado de JogosPage.class e e resolvido pelo
# Wicket a partir da hierarquia/nome do componente, independente da classe de
# Application. Serve de FALLBACK quando a chave nao existir no bundle _en.
# Mensagens com {0}, {1}, ... usam java.text.MessageFormat (StringResourceModel).
# Mantenha PARIDADE de chaves com JogosPage_en.properties.
# ==========================================================================

# --- Cabecalho / pagina ---
app.titulo=Placar
app.subtitulo=Gerenciamento de placares de partidas de futebol em tempo real.

# --- Seletor de idioma ---
idioma.rotulo=Idioma
idioma.pt=Portugues
idioma.en=English
idioma.trocar=Trocar

# --- Card de criacao / listagem ---
card.novoJogo.titulo=Novo jogo
card.novoJogo.descricao=Cadastre uma nova partida informando os times e a data/hora.

# --- Filtro por status ---
filtro.statusRotulo=Status:
filtro.botao=Filtrar
# Chave usada pelo Wicket para o texto da opcao nula (vazia) de um DropDownChoice
# com setNullValid(true). E o rotulo "Todos" do filtro de status.
nullValid=Todos

# --- Cabecalhos da tabela ---
tabela.id=ID
tabela.partida=Partida
tabela.status=Status
tabela.dataHora=Data/Hora
tabela.acoes=Acoes

# --- Separador visual de placar (time A x time B) ---
placar.separador=x

# --- Status (exibicao traduzida; NAO altera o enum do dominio) ---
status.EM_ANDAMENTO=Em andamento
status.ENCERRADO=Encerrado

# --- Formato de data/hora sensivel ao locale (padrao de DateTimeFormatter) ---
formato.dataHora=dd/MM/yyyy HH:mm

# --- Mensagem de feedback propria da pagina ---
feedback.listarErroGenerico=Nao foi possivel carregar os jogos no momento. Tente novamente.
