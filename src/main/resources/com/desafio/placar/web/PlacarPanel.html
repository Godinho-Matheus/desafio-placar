<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
    <wicket:panel>
        <!-- Atualizacao de placar: submit sincrono simples (sem Ajax). Textos i18n. -->
        <form wicket:id="atualizarPlacarForm" class="placar-acoes acao-atualizar">
            <input type="number" wicket:id="placarA" size="3"/>
            <span><wicket:message key="placar.separador">x</wicket:message></span>
            <input type="number" wicket:id="placarB" size="3"/>
            <button wicket:id="atualizarBotao" type="submit"><wicket:message key="placar.atualizarBotao">Atualizar placar</wicket:message></button>
        </form>
        <!-- Encerramento: submit sincrono simples (sem Ajax). -->
        <form wicket:id="encerrarForm" class="placar-acoes acao-encerrar">
            <button wicket:id="encerrarBotao" type="submit"><wicket:message key="placar.encerrarBotao">Encerrar</wicket:message></button>
        </form>
    </wicket:panel>
</body>
</html>
